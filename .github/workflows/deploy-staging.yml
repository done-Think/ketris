name: Deploy staging (migrate + seed)

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    environment: staging

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PLATFORM_ADMIN_NAME: ${{ secrets.PLATFORM_ADMIN_NAME }}
      PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      CONTRACTS_DATA_ENCRYPTION_KEY: ${{ secrets.CONTRACTS_DATA_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Valida a chave de proteção de Contracts antes de alterar o banco
        run: |
          node --input-type=module <<'JS'
          const key = process.env.CONTRACTS_DATA_ENCRYPTION_KEY ?? ''
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(key) || Buffer.from(key, 'base64').length !== 32) {
            throw new Error('Configure CONTRACTS_DATA_ENCRYPTION_KEY com 32 bytes em base64.')
          }
          JS

      - name: Aplica as migrations pendentes no RDS de staging
        run: npm run db:deploy -w @ketris/web

      - name: Roda o seed (idempotente — ver prisma/seed.ts)
        run: npm run db:seed -w @ketris/web

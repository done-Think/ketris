name: Staging release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite RELEASE para publicar o commit atual da dev'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ketris-staging-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || inputs.confirm == 'RELEASE')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://ketris-web-x9bk.vercel.app
    env:
      RELEASE_ENABLED: ${{ vars.STAGING_RELEASE_ENABLED }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      CONTRACTS_DATA_ENCRYPTION_KEY: ${{ secrets.CONTRACTS_DATA_ENCRYPTION_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      STAGING_SNAPSHOT_ENABLED: ${{ vars.STAGING_SNAPSHOT_ENABLED || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Confere a ativação do environment
        id: activation
        shell: bash
        run: |
          if [ "$RELEASE_ENABLED" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Staging release is disabled. Configure the environment and enable STAGING_RELEASE_ENABLED.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.activation.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.activation.outputs.enabled == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Confere CI para a recuperação manual
        if: steps.activation.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', head_sha: context.sha, status: 'completed', per_page: 100});
            if (!data.workflow_runs.some(run => run.conclusion === 'success' && run.head_branch === 'dev' && run.event === 'push')) {
              core.setFailed('Successful CI on dev is required for this exact commit.');
            }
      - run: npm ci
        if: steps.activation.outputs.enabled == 'true'
      - name: Instala a CLI da Vercel com versão fixada
        if: steps.activation.outputs.enabled == 'true'
        run: npm install --global vercel@65.5.0
      - name: Autentica na AWS para snapshots opcionais
        if: steps.activation.outputs.enabled == 'true' && vars.STAGING_SNAPSHOT_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Prepara, migra, valida e promove o mesmo artefato
        if: steps.activation.outputs.enabled == 'true'
        run: node scripts/staging-release.mjs

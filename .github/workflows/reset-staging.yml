name: Reset staging database (destrutivo)

# Disparo manual apenas — nunca automático. Apaga TODOS os dados do RDS de staging, reaplica
# as migrations do zero e roda o seed do branch selecionado na tela de disparo. Use antes de
# mesclar uma alteração no seed.ts que reorganiza dados já existentes (evita upsert em cima de
# uma estrutura antiga incompatível).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite RESET para confirmar — isso apaga todos os dados do banco de staging'
        required: true

concurrency:
  group: ketris-staging-release
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/dev' && github.event.inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    environment: staging

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PLATFORM_ADMIN_NAME: ${{ secrets.PLATFORM_ADMIN_NAME }}
      PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      CONTRACTS_DATA_ENCRYPTION_KEY: ${{ secrets.CONTRACTS_DATA_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Valida a chave de proteção de Contracts antes de resetar o banco
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const target = JSON.parse(readFileSync('infra/deploy/staging.json', 'utf8'))
          const url = new URL(process.env.DATABASE_URL ?? '')
          if (!['postgres:', 'postgresql:'].includes(url.protocol) || url.hostname !== target.databaseHost || url.pathname !== `/${target.databaseName}` || (url.port && url.port !== '5432')) throw new Error('Reset requires the declared staging database.')
          const key = process.env.CONTRACTS_DATA_ENCRYPTION_KEY ?? ''
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(key) || Buffer.from(key, 'base64').length !== 32) {
            throw new Error('Configure CONTRACTS_DATA_ENCRYPTION_KEY com 32 bytes em base64.')
          }
          JS

      - name: Reseta o schema (apaga TODOS os dados atuais e reaplica as migrations)
        run: npm exec -w @ketris/web -- prisma migrate reset --force

      - name: Roda o seed do branch selecionado na tela de disparo
        run: npm run db:seed -w @ketris/web
